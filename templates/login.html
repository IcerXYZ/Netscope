<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d16"><title>NetScope | Sign in</title><link rel="stylesheet" href="/static/app.css"></head>
<body data-theme="dark" style="min-height:100vh;display:grid;place-items:center;padding:20px">
<main style="width:min(420px,100%);padding:32px;border:1px solid #1e2c3f;border-radius:14px;background:#101a29">
<div style="font-weight:850;letter-spacing:2px;color:#e5edf7">NETSCOPE</div><p style="color:#8495aa;font-size:10px;letter-spacing:1px">NETWORK INTELLIGENCE</p>
<h1 style="font-size:25px;margin:28px 0 8px">Sign in</h1><p style="color:#8495aa">Authenticate to access this NetScope dashboard.</p>
{% if error %}<p role="alert" style="color:#e16c73">{{ error }}</p>{% endif %}
<form method="post" action="/login">
<label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="64" style="display:block;width:100%;padding:12px;margin:8px 0 18px;background:#0d1725;color:#e5edf7;border:1px solid #1e2c3f;border-radius:7px">
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required style="display:block;width:100%;padding:12px;margin:8px 0 20px;background:#0d1725;color:#e5edf7;border:1px solid #1e2c3f;border-radius:7px">
<button type="submit" style="width:100%;padding:12px;background:#39b9ad;color:#041514;border:0;border-radius:7px;font-weight:800;cursor:pointer">Sign in</button>
</form></main></body></html>

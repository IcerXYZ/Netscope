name: NetScope security checks
on:
  push:
    branches: ["main", "security/**"]
  pull_request:
    branches: ["main"]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install pip-audit
      - run: python -m compileall -q app.py security.py telemetry_schema.py configure.py agent_tokens.py tests
      - run: bash -n install.sh uninstall.sh tests/linux_smoke.sh tests/docker_smoke.sh packaging/build-deb.sh
      - run: python -m unittest discover -s tests -v
      - run: node tests/frontend.cjs .
      - run: pip-audit -r requirements.txt
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: bash tests/linux_smoke.sh
      - if: failure()
        run: sudo journalctl -u netscope --no-pager -n 60
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: bash tests/docker_smoke.sh


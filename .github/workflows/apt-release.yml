name: Build and publish APT repository
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: apt-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev gnupg
      - name: Build Debian package
        run: VERSION="${GITHUB_REF_NAME#v}" ./packaging/build-deb.sh
      - name: Build and sign APT repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$APT_SIGNING_KEY" || { echo "Missing APT_SIGNING_KEY secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/gnupg" public/apt/pool/main/n/netscope public/apt/dists/stable/main/binary-all
          chmod 700 "$RUNNER_TEMP/gnupg"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          cp dist/*.deb public/apt/pool/main/n/netscope/
          cd public/apt
          dpkg-scanpackages --arch all pool /dev/null > dists/stable/main/binary-all/Packages
          gzip -9c dists/stable/main/binary-all/Packages > dists/stable/main/binary-all/Packages.gz
          apt-ftparchive release dists/stable > dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "$APT_SIGNING_PASSPHRASE" -abs -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "$APT_SIGNING_PASSPHRASE" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --armor --export > public.key
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

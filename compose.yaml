services:
  netscope:
    build: .
    image: netscope:local
    restart: unless-stopped
    init: true
    # Required for host interface counters; no host filesystem or PID sharing.
    network_mode: host
    user: "10001:10001"
    read_only: true
    mem_limit: 512m
    pids_limit: 64
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,mode=1777
    env_file:
      - .env
    volumes:
      - ./runtime:/etc/netscope:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL


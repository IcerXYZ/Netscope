services:
  netscope:
    build:
      context: .
    image: netscope:latest
    container_name: netscope
    restart: unless-stopped
    init: true
    # Host networking lets NetScope see the host's real network interfaces.
    network_mode: host
    # Host PID namespace lets process metadata refer to host processes.
    pid: host
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    volumes:
      # Read-only host root is used only to report host disk capacity.
      - /:/host:ro,rslave
    environment:
      NETSCOPE_ROLE: ${NETSCOPE_ROLE:-single}
      NETSCOPE_HOST: 0.0.0.0
      NETSCOPE_PORT: ${NETSCOPE_PORT:-8080}
      NETSCOPE_HOST_ROOT: /host
      NETSCOPE_SERVER_URL: ${NETSCOPE_SERVER_URL:-}
      NETSCOPE_AGENT_TOKEN: ${NETSCOPE_AGENT_TOKEN:-}
      NETSCOPE_DISCORD_WEBHOOK: ${NETSCOPE_DISCORD_WEBHOOK:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
